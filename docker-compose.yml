services:
  postgres:
    image: postgres:15
    container_name: postgres-backend
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: bairas
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: project_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
